<script type="module">
  import { wordSort } from "./sort.js";

  const testCases = [
    ["low", "medium", "high"],
    ["never", "rarely", "often", "always"],
    ["terrible", "bad", "okay", "good", "great", "excellent"],
    ["hate", "dislike", "like", "love"],
    ["tiny", "small", "medium", "large", "huge"],
    ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
    ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"],
    ["bronze", "silver", "gold", "platinum"],
    ["first", "second", "third", "fourth", "fifth"],
    ["spring", "summer", "autumn", "winter"],
    ["left", "center", "right"],
    ["Mercury", "Venus", "Earth", "Mars", "Jupiter", "Saturn", "Uranus", "Neptune"],
  ];

  function log(...args) {
    const el = document.createElement('pre');
    el.textContent = args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : a).join(' ');
    el.style.cssText = 'margin:2px 0; font-size:12px; color:#555';
    document.body.appendChild(el);
  }

  function renderBarChart(section, title, projections) {
    const keys = Object.keys(projections);
    const vals = Object.values(projections);
    const min = Math.min(...vals);
    const max = Math.max(...vals);
    const range = max - min || 1;

    const wrap = document.createElement('div');
    wrap.innerHTML = `<b>${title}</b>`;
    wrap.style.cssText = 'margin:8px 0';

    const grid = document.createElement('div');
    grid.style.cssText = 'display:grid; grid-template-columns: max-content 1fr max-content; gap:3px 8px; align-items:center; margin-top:4px';

    for (const key of keys) {
      const val = projections[key];
      const pct = ((val - min) / range) * 100;

      const label = document.createElement('span');
      label.textContent = key;
      label.style.cssText = 'text-align:right; white-space:nowrap';

      const bar = document.createElement('div');
      bar.style.cssText = `background:#4a90d9; height:16px; width:${pct.toFixed(1)}%; min-width:2px; border-radius:2px`;

      const num = document.createElement('span');
      num.textContent = val.toFixed(3);
      num.style.cssText = 'color:#888; font-size:11px; white-space:nowrap';

      grid.appendChild(label);
      grid.appendChild(bar);
      grid.appendChild(num);
    }

    wrap.appendChild(grid);
    section.appendChild(wrap);
  }

  function renderScatter(section, title, labels, points) {
    const W = 300, H = 300, PAD = 30;
    const xs = points.map(p => p[0]), ys = points.map(p => p[1]);
    const xMin = Math.min(...xs), xMax = Math.max(...xs);
    const yMin = Math.min(...ys), yMax = Math.max(...ys);
    const xRange = xMax - xMin || 1, yRange = yMax - yMin || 1;
    const xMid = (xMin + xMax) / 2, yMid = (yMin + yMax) / 2;
    const scale = Math.max(xRange, yRange) || 1;

    const toSvgX = x => W/2 + ((x - xMid) / scale) * (W - PAD * 2);
    const toSvgY = y => H/2 - ((y - yMid) / scale) * (H - PAD * 2);

    const dots = points.map((p, i) => `
      <circle cx="${toSvgX(xs[i]).toFixed(1)}" cy="${toSvgY(ys[i]).toFixed(1)}" r="4" fill="#4a90d9"/>
      <text x="${(toSvgX(xs[i]) + 6).toFixed(1)}" y="${(toSvgY(ys[i]) + 4).toFixed(1)}" font-size="11" fill="#333">${labels[i]}</text>
    `).join('');

    const axes = `
      <line x1="${PAD}" y1="${toSvgY(0).toFixed(1)}" x2="${W-PAD}" y2="${toSvgY(0).toFixed(1)}" stroke="#ccc"/>
      <line x1="${toSvgX(0).toFixed(1)}" y1="${PAD}" x2="${toSvgX(0).toFixed(1)}" y2="${H-PAD}" stroke="#ccc"/>
    `;

    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <b>${title}</b>
      <svg width="${W}" height="${H}" style="display:block;border:1px solid #eee;border-radius:4px">
        ${axes}${dots}
      </svg>
    `;
    section.appendChild(wrap);
  }

  for (const testCase of testCases) {
    const section = document.createElement('div');
    section.style.cssText = 'border:1px solid #ddd; margin:16px; padding:16px; font-family:monospace; border-radius:6px';
    document.body.appendChild(section);

    const result = await wordSort(testCase);
    const sorted = result.toSorted();
    const { linearProjections, planarProjections } = result.debug;

    section.innerHTML += `<h3 style="margin:0 0 8px">${testCase.join(', ')}</h3>`;
    section.innerHTML += `<div><b>wordSort:</b> ${sorted.join(', ')}</div>`;

    const charts = document.createElement('div');
    charts.style.cssText = 'display:flex; gap:24px; margin-top:12px; flex-wrap:wrap';
    section.appendChild(charts);

    const barWrap = document.createElement('div');
    charts.appendChild(barWrap);
    renderBarChart(barWrap, 'Linear Projections (orderVec)', linearProjections);

    const scatterWrap = document.createElement('div');
    charts.appendChild(scatterWrap);
    renderScatter(scatterWrap, 'Planar Projections (PC1 vs PC2)', testCase, planarProjections);
  }
</script>
