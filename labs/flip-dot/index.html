<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    display: grid;
    place-content: center;
    background: black;
    color: #ccc;
    font-family: sans-serif;
    --spring-easing: linear(
      0, 0.15 3.3%, 1 12.2%, 0.842 15.4%, 0.792 18.9%, 0.823 22.1%, 1 31.1%, 0.967,
      0.957 37.7%, 1 49.9%, 1
    );
  }

  .container {
    position: relative;
    background: #0d0d10;
    padding: var(--dot);
    border-radius: calc(var(--dot) * 0.5);
    will-change: transform;
    transform: scale(0.9);
    cursor: wait;
    --dot: 15px;
    --duration: 0.4s;
    --dot-delay-factor: 0.015s;
    transition: transform 0.4s;

    &::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: calc(var(--dot) * 0.5);
      border: solid calc(var(--dot) * 0.1) #bef2;
      box-shadow: inset 0 calc(var(--dot) * -8) calc(var(--dot) * 8) #acf4;
    }

    &:hover {
      transform: scale(1);
      --duration: 2s;
      --dot-delay-factor: 0.075s;
    }
  }

  .row {
    text-wrap: nowrap;
    will-change: contents;
  }

  .dot {
    display: inline-block;
    position: relative;
    margin: calc(var(--dot) * 0.05);
    width: var(--dot);
    height: var(--dot);
    clip-path: polygon(75% 0, 75% 15%, 85% 25%, 100% 25%, 100% 100%, 0 100%, 0 0);
    --dot-duration: calc(var(--duration) * (1.0 + var(--dot-quality) * 0.5));
    --flip-duration: calc(var(--dot-duration) * 0.074);
    --dot-delay: calc(var(--dot-index) * var(--dot-delay-factor));
    --opacity-duration: calc(var(--flip-duration) * 0.2);
    --opacity-delay: calc(var(--dot-delay) + var(--flip-duration) - var(--opacity-duration) * 0.5);
    transition: transform var(--dot-duration) var(--dot-delay) var(--spring-easing);

    &::before {
      content: '';
      display: block;
      position: absolute;
      inset: 0;
      border-radius: 50%;
      opacity: 1;
      border-bottom: solid calc(var(--dot) * 0.1) #234;
      background-image: linear-gradient(to top right, #246,#141414 33%);
      background-size: 300% 300%;
      background-position: 100% 0%;
      transition:
        background-position var(--flip-duration) calc(var(--dot-delay) + var(--flip-duration)) ease-in-out,
        opacity var(--opacity-duration) var(--opacity-delay);
    }

    &::after {
      content: '';
      display: block;
      position: absolute;
      inset: 0;
      border-radius: 50%;
      opacity: 0;
      border-right: solid calc(var(--dot) * 0.15) #efc;
      background-image: linear-gradient(to top right, #784, #cd6);
      background-size: 150% 150%;
      background-position: 0% 100%;
      transition:
        background-position var(--flip-duration) var(--dot-delay) ease-in-out,
        opacity var(--opacity-duration) var(--opacity-delay);
    }

    &.on {
      transform: rotate3d(1, 1, 0, 0.5turn);
      &::before {
        opacity: 0;
        background-position: 0% 100%;
        transition-delay: var(--dot-delay), var(--opacity-delay);
      }
      &::after {
        opacity: 1;
        background-position: 100% 0%;
        transition-delay: calc(var(--dot-delay) + var(--flip-duration)), var(--opacity-delay);
      }
    }
  }
</style>

    const flipSoundPool = Array.from({ length: height * 6 }, () => {
      const flipSound = new Audio("./flip.ogg");
      flipSound.preservesPitch = false;
      return flipSound;
    });
    let slow = false;
    let windowFocused = true;
    let soundIndex = 0;
    flipSoundPool[soundIndex].load();
    flipSoundPool[soundIndex].volume = 0;
    container.addEventListener("transitionstart", event => {
      if (event.target === container) return;
      if (soundCheckbox.checked && windowFocused) {
        const flipSound = flipSoundPool[soundIndex];
        flipSound.playbackRate = (slow ? 0.2 : 1) * (1 + Math.random() * 0.05);
        flipSound.volume = Math.min(1, flipSound.volume + 0.002);
        flipSound.play();
        const nextIndex = (soundIndex + 1) % flipSoundPool.length;
        requestAnimationFrame(() => {
          flipSoundPool[nextIndex].volume = 0;
          soundIndex = nextIndex;
        });
      }
    });
    container.addEventListener("mouseover", () => { slow = true });
    container.addEventListener("mouseout", () => { slow = false });
    window.addEventListener("focus", () => { windowFocused = true });
    window.addEventListener("blur", () => { windowFocused = false });

      const frame = Array.from({ length: width * height }, (_, i) => {

        return buffer[y]?.[x] ?? 0;
      });
      return frame;
