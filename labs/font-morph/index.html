<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Changa+One&family=DynaPuff:wght@700&display=swap" rel="stylesheet">

<style>
  .dynapuff {
    font-family: "DynaPuff", system-ui;
    font-optical-sizing: auto;
    font-weight: 700;
    font-style: normal;
    font-variation-settings: "wdth" 100;
  }

  .changa {
    font-family: "Changa One", sans-serif;
    font-weight: 400;
    font-style: normal;
  }

  span {
    display: inline-block;
    width: 10vmin;
    font-size: 10vmin;
    text-align: center;
  }

  hover-morph {
    padding: 16px;
    display: inline-grid;
    place-content: center;
    position: relative;
    left: 10%;
    top: 10%;
    filter: contrast(16);
    background-color: white;

    > * {
      grid-area: 1 / 1;
      
      &:last-of-type {
        opacity: 0;
      }
    }

    &:hover {
      animation: morph-darken 0.3s ease-in;

      > * {
        transition: opacity 0.3s ease-in;
        animation: morph-blur 0.3s ease-in;

        &:first-of-type {
          opacity: 0;
        }
        &:last-of-type {
          opacity: 1;
        }
      }
    }
  }

  @keyframes morph-darken {
    from, to {
      filter: brightness(1) contrast(16);
    }
    50% {
      filter: brightness(0.8) contrast(16);
    }
  }
  @keyframes morph-blur {
    50% {
      filter: blur(3px);
    }
  }
</style>

<hover-morph>
  <div class="changa">
    <span>O</span><span>R</span><span>P</span><span>H</span><span>E</span><span>U</span>
  </div>
  <div class="dynapuff">
    <span>O</span><span>R</span><span>P</span><span>H</span><span>E</span><span>U</span>
  </div>
</hover-morph>
