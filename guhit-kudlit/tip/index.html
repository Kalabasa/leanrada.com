<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>GuhitKudlit Tip</title>

    <link rel="icon" href="../favicon.png" />

    <script async src="/analytics/analytics.js"></script>

    <link rel="stylesheet" href="../lib/reset.css" />
    <link rel="stylesheet" href="../global.css" />
    <link rel="stylesheet" href="../font/font.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&display=swap"
    />
    <style>
      body {
        background: url("../bgnoise.png"), var(--color-bg-darker);
      }

      main {
        margin: var(--size-l) auto;
        padding: 0 var(--size-l);
        max-width: 800px;
        line-height: 1.3;
      }

      a {
        text-decoration: underline;
        color: var(--color-orange-darker);
        text-underline-offset: 0.2em;
      }
    </style>
  </head>
  <body>
    <main>
      <p>
        I can’t accept tips yet, thanks for the thought though!
        <a href="../">Back</a>
        <script>
          document.currentScript.previousElementSibling.addEventListener(
            "click",
            (event) => {
              event.preventDefault();
              if (history.length > 1) {
                history.back();
              } else {
                window.close();
              }
            },
          );
        </script>
      </p>
    </main>
  </body>
</html>
