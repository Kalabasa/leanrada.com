<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>gamegame</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: system-ui, sans-serif;
    color: #fff;
    touch-action: none;
  }
  #container {
    position: relative;
    height: 100%;
    overflow: hidden;
  }
  .slide {
    position: absolute;
    left: 0;
    width: 100%;
    height: 100%;
    will-change: transform;
  }
  .slide-result {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    font-weight: bold;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 10;
  }
  .slide-result.visible { opacity: 1; }

  /* --- Universal Timer --- */
  #timer-wrap {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 40px;
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
  }
  #timer-bar-bg {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.1);
  }
  #timer-bar {
    height: 100%;
    background: #fff;
    width: 100%;
    transition: none;
  }
  #timer-bar.urgent { background: #ff4444; }
  #timer-text {
    margin-top: 4px;
    font-size: 0.85rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    opacity: 0.9;
  }
  #timer-text.urgent { color: #ff4444; }

  /* --- Pause button --- */
  #btn-pause {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 300;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(4px);
    border: none;
    color: #fff;
    font-size: 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #btn-pause:active { transform: scale(0.9); }

  /* --- Pause menu --- */
  #pause-menu {
    position: fixed;
    inset: 0;
    z-index: 400;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }
  #pause-menu.visible { display: flex; }
  #pause-menu h2 {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  .pause-btn {
    width: 200px;
    padding: 14px 0;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .pause-btn:active { background: rgba(255,255,255,0.2); }

  /* --- Title screen --- */
  #title-screen {
    position: fixed;
    inset: 0;
    z-index: 500;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #title-screen.hidden { display: none; }
  #title-screen h1 {
    font-size: 3rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  #title-screen p {
    font-size: 1rem;
    opacity: 0.5;
    animation: blink 1.5s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 0.15; }
  }

</style>
</head>
<body>

<div id="title-screen">
  <h1>gamegame</h1>
  <p>tap to start</p>
</div>

<div id="timer-wrap">
  <div id="timer-bar-bg"><div id="timer-bar"></div></div>
  <div id="timer-text">0.0</div>
</div>

<div id="container">
  <div class="slide" id="current"></div>
  <div class="slide" id="next"></div>
</div>

<button id="btn-pause">&#x23F8;</button>

<div id="pause-menu">
  <h2>PAUSED</h2>
  <button class="pause-btn" id="pause-resume">Resume</button>
  <button class="pause-btn" id="pause-skip">Skip</button>
</div>


<script type="module">
import { createEngine, msUntilNextBeat, beatsToMs, getBpm, setBpm, pauseAudio, resumeAudio, muteDrums, unmuteDrums } from './engine.js';
import { dragGame } from './games/drag.js';
import { dodgeGame } from './games/dodge.js';
import { parryGame } from './games/parry.js';
import { oddOneOutGame } from './games/oddoneout.js';
import { splitGame } from './games/split.js';
import { countGame } from './games/count.js';
import { matchGame } from './games/match.js';

// --- Universal Timer (pausable) ---
const timerBar = document.getElementById('timer-bar');
const timerText = document.getElementById('timer-text');
let timerRaf = null;
let timerStart = 0;
let timerDuration = 0;
let timerElapsed = 0; // tracks elapsed across pauses
let timerOnExpire = null;
let timerRunning = false;
let timerPaused = false;

function startTimer(durationMs, onExpire) {
  stopTimer();
  timerDuration = durationMs;
  timerElapsed = 0;
  timerStart = performance.now();
  timerOnExpire = onExpire;
  timerRunning = true;
  timerPaused = false;
  timerBar.classList.remove('urgent');
  timerText.classList.remove('urgent');
  timerBar.style.background = '#fff';
  tickTimer();
}

function tickTimer() {
  if (!timerRunning || timerPaused) return;
  const now = performance.now();
  const elapsed = timerElapsed + (now - timerStart);
  const remaining = Math.max(0, timerDuration - elapsed);
  const frac = remaining / timerDuration;
  timerBar.style.width = (frac * 100) + '%';
  timerText.textContent = (remaining / 1000).toFixed(1);
  if (frac < 0.25) {
    timerBar.classList.add('urgent');
    timerText.classList.add('urgent');
  }
  if (remaining <= 0) {
    timerRunning = false;
    if (timerOnExpire) timerOnExpire();
    return;
  }
  timerRaf = requestAnimationFrame(tickTimer);
}

function pauseTimer() {
  if (!timerRunning || timerPaused) return;
  timerPaused = true;
  timerElapsed += performance.now() - timerStart;
  if (timerRaf) cancelAnimationFrame(timerRaf);
  timerRaf = null;
}

function resumeTimer() {
  if (!timerRunning || !timerPaused) return;
  timerPaused = false;
  timerStart = performance.now();
  tickTimer();
}

function stopTimer() {
  timerRunning = false;
  timerPaused = false;
  if (timerRaf) cancelAnimationFrame(timerRaf);
  timerRaf = null;
  timerOnExpire = null;
}

// --- Pause/Resume on visibility change ---
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    pauseTimer();
    pauseAudio();
  } else {
    resumeAudio();
    resumeTimer();
  }
});
window.addEventListener('blur', () => {
  pauseTimer();
  pauseAudio();
});
window.addEventListener('focus', () => {
  resumeAudio();
  resumeTimer();
});

// --- Pause ---
let paused = false;
const pauseMenu = document.getElementById('pause-menu');

function togglePause() {
  if (paused) {
    paused = false;
    pauseMenu.classList.remove('visible');
    resumeAudio();
    resumeTimer();
  } else {
    paused = true;
    pauseMenu.classList.add('visible');
    pauseTimer();
    pauseAudio();
  }
}

document.getElementById('btn-pause').addEventListener('pointerdown', (e) => {
  e.stopPropagation();
  togglePause();
});

document.getElementById('pause-resume').addEventListener('pointerdown', (e) => {
  e.stopPropagation();
  if (paused) togglePause();
});

document.getElementById('pause-skip').addEventListener('pointerdown', (e) => {
  e.stopPropagation();
  if (paused) {
    paused = false;
    pauseMenu.classList.remove('visible');
    resumeAudio();
  }
  if (!activeEngine) return;
  stopTimer();
  activeEngine.cleanup();
  activeEngine = null;
  gameIndex++;
  transition(() => {
    const tmp = currentEl.id;
    currentEl.id = nextEl.id;
    nextEl.id = tmp;
    startGame();
  });
});

// --- Game loop ---
const currentEl = document.getElementById('current');
const nextEl = document.getElementById('next');

let gameIndex = 0;
let winCount = 0;
let activeEngine = null;

const gameTypes = [dragGame, dodgeGame, parryGame, oddOneOutGame, splitGame, countGame, matchGame];

function transition(callback) {
  const h = window.innerHeight;
  currentEl.style.transition = 'transform 0.4s ease-in-out';
  nextEl.style.transition = 'transform 0.4s ease-in-out';
  nextEl.style.transform = `translateY(${h}px)`;
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      currentEl.style.transform = `translateY(${-h}px)`;
      nextEl.style.transform = `translateY(0)`;
    });
  });
  setTimeout(() => {
    currentEl.style.transition = 'none';
    nextEl.style.transition = 'none';
    callback();
  }, 420);
}

function endGame(result, _score) {
  stopTimer();
  if (result === 'win') {
    winCount++;
    setBpm(Math.min(180, getBpm() + 3));
  } else {
    winCount = Math.max(0, winCount - 1);
  }
  if (activeEngine) {
    activeEngine.showResult(result);
    activeEngine.sound[result === 'win' ? 'win' : 'lose']();
  }

  // Wait for next beat, then one more beat for the result to breathe, then transition on a beat
  const waitForBeat = msUntilNextBeat();
  const oneBeat = beatsToMs(1);
  setTimeout(() => {
    if (activeEngine) { activeEngine.cleanup(); activeEngine = null; }
    // Transition on the NEXT beat after the result
    const transitionWait = msUntilNextBeat();
    setTimeout(() => {
      gameIndex++;
      transition(() => {
        const tmp = currentEl.id;
        currentEl.id = nextEl.id;
        nextEl.id = tmp;
        startGame();
      });
    }, transitionWait);
  }, waitForBeat + oneBeat);
}

function startGame() {
  const gameFn = gameTypes[Math.floor(Math.random() * gameTypes.length)];
  currentEl.style.transform = 'translateY(0)';
  nextEl.style.transform = `translateY(${window.innerHeight}px)`;

  // Prep next slide
  nextEl.innerHTML = '';
  nextEl.style.background = '#111';

  // Create engine for this game
  const engine = createEngine(currentEl, endGame);
  activeEngine = engine;

  // Init game — pass the api so games can use drawing helpers in setup
  engine.api.complexity = Math.pow(winCount, 1.5) * 0.1;
  const gameDef = gameFn(engine.api);
  const durationMs = engine.getDurationMs(gameDef.duration);
  const timeoutResult = gameDef.timeoutResult || 'lose';
  const title = gameDef.title || '';

  // Show title card for 2 beats, then start the game
  const titleMs = beatsToMs(2);
  const titleDef = {
    draw(api) {
      api.clear('#111');
      const pulse = 1 + 0.15 * api.pulse;
      api.fill('#fff');
      api.push();
      api.translate(api.width / 2, api.height / 2);
      api.scale(pulse);
      api.text(title, 0, 0, 32);
      api.pop();
    },
  };
  engine.run(titleDef);

  setTimeout(() => {
    if (activeEngine !== engine) return; // skipped
    engine.run(gameDef);
    startTimer(durationMs, () => endGame(timeoutResult, timeoutResult === 'win' ? 1 : 0));
  }, titleMs);
}

document.getElementById('title-screen').addEventListener('click', () => {
  resumeAudio();
  document.getElementById('title-screen').classList.add('hidden');
  startGame();
}, { once: true });
</script>
</body>
</html>
