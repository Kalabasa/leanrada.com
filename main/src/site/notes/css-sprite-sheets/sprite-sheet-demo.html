<div
  class="sprite-sheet-demo"
  role="img"
  :alt="attrs.alt"
  :style="`
    --src:url(${attrs.src});
    --sheet-width:${attrs.sheetWidth};
    --sheet-height:${attrs.sheetHeight};
    --offset-x:${attrs.offsetX};
    --offset-y:${attrs.offsetY};
    --tile-width:${attrs.tileWidth};
    --tile-height:${attrs.tileHeight};
    --tile-from-x:${attrs.tileFromX};
    --tile-from-y:${attrs.tileFromY};
    --tile-to-x:${attrs.tileToX};
    --tile-to-y:${attrs.tileToY};
    --frames:${attrs.frames};
    --frame-delay:${attrs.frameDelay}
  `"
></div>

<style>
  .sprite-sheet-demo {
    width: var(--tile-width);
    height: var(--tile-height);
    background-image: var(--src);
    background-size: var(--sheet-width) var(--sheet-height);
    background-position-x: calc(
      -1 * var(--tile-width) * var(--tile-from-x) - var(--offset-x, 0px)
    );
    background-position-y: calc(
      -1 * var(--tile-height) * var(--tile-from-y) - var(--offset-y, 0px)
    );
    animation: spriteSheetDemo calc(var(--frames, 1) * var(--frame-delay)) steps(var(--frames), jump-none) infinite;
  }
  @keyframes spriteSheetDemo {
    from {
      background-position-x: calc(
        -1 * var(--tile-width) * var(--tile-from-x) - var(--offset-x, 0px)
      );
      background-position-y: calc(
        -1 * var(--tile-height) * var(--tile-from-y) - var(--offset-y, 0px)
      );
    }
    to {
      background-position-x: calc(
        -1 * var(--tile-width) * var(--tile-to-x) - var(--offset-x, 0px)
      );
      background-position-y: calc(
        -1 * var(--tile-height) * var(--tile-to-y) - var(--offset-y, 0px)
      );
    }
  }
</style>
