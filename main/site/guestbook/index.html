<script>
  window.GUESTBOOK_API = window.location.hostname === "localhost"
      ? "http://localhost:8787/api"
      : window.location.hostname === "leanrada.com"
        ? "https://guestbook.leanrada.com/api"
        : "https://alt-guestbook.leanrada.com/api";
</script>

  <input name="fontIndex" type="hidden" value="0" />
  <input name="bgStyleIndex" type="hidden" value="0" />
  <input name="bgRGB" type="hidden" value="0xffffff" />
  <input name="fgRGB" type="hidden" value="0x000000" />
  <guestbook-card id="guestbook-card">
    <textarea name="text" placeholder="Your message" required autocomplete="off"></textarea>
    <input name="name" placeholder="Name / pseudonym" autocomplete="off" />
    <input name="website" placeholder="Your website" autocomplete="off" />
    <div></div>
  </guestbook-card>
  <div class="button-row">

    <button class="style-button" id="stampBtn" type="button">Stamp</button>
    <button class="submit-button" id="submitBtn" type="submit">Send</button>
  </div>
</form>

<style>
  guestbook-card {
    position: relative;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 10px #0002;
    background: var(--gbc-background-image, none)
      var(--gbc-background-color, white);
    color: var(--gbc-color, black);
    text-shadow: 0 0 1px var(--gbc-color, black);
    font-family: var(--gbc-font, sans-serif);
    font-size: 1rem;
    font-weight: bold;
    padding: 1em;
    max-width: 100vw;
    width: 384px;
    height: 192px;
    box-sizing: border-box;
    border-radius: 3px;
    overflow: hidden;
    filter: contrast(0.8);
    &::after {
      content: "";
      position: absolute;
      inset: 0;
      background: url("./noise.png");
      opacity: 0.08;
      mix-blend-mode: hard-light;
      filter: blur(0.5px);
      pointer-events: none;
    }
    > textarea {
      flex: 1 1 auto;
      resize: none;
    }
    > input {
      flex: 0 1 auto;
      text-align: right;
    }
    > textarea,
    > input {
      background: none;
      border: none;
      font: inherit;
      color: inherit;
      text-shadow: inherit;
    }
    > textarea::placeholder,
    > input::placeholder {
      color: inherit;
      opacity: 0.4;
    }
    &[disabled] {
      > textarea::placeholder,
      > input::placeholder {
        opacity: 0;
      }
    }
    > div {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    > div > div {
      position: absolute;
      font-size: 60px;
      color: black;
      filter: grayscale(0.5) brightness(1.07) drop-shadow(0 1px 0 #0002);
      mix-blend-mode: multiply;
    }
  }

  [name=website] {
    display: none;
  }

  .intro,
  .form {
    margin: 18px auto;
    max-width: 384px;
    box-sizing: border-box;
  }
  #guestbook-card {
    view-transition-name: form-guestbook-card;
  }
  .button-row {
    position: relative;
    display: flex;
    margin-top: 12px;
    gap: 12px;
    flex-wrap: wrap;
    z-index: 1;
  }
  .style-button {
    display: inline-block;
    position: relative;
    width: 30px;
    height: 30px;
    overflow: hidden;
    color: transparent;
    background: var(--card-clr);
    border: none;
    border-radius: 18px;
    cursor: pointer;
    &:hover,
    &:focus-visible {
      background-color: var(--clr0-dark);
    }
  }
  .style-button::after {
    position: absolute;
    inset: 6px;
    content: "";
  }
  #bgStyleBtn::after {
    background: var(--gbc-background-image, none) #fff;
    inset: -25%;
    border-radius: 18px;
    filter: brightness(0.5) contrast(8) brightness(2);
    transform: scale(0.5);
  }
  #fgBtn::after {
    content: "A";
    font-size: 18px;
    line-height: 18px;
    color: var(--gbc-color, black);
    text-shadow: -1px -2px 0 white, 1px -2px 0 white, -2px 0 0 white,
      2px 0 0 white, -2px 1px 0 white, 2px 1px 0 white, -2px 2px 0 white,
      2px 2px 0 white, 0 2px 0 white;
  }
  #bgBtn::after {
    background: var(--gbc-background-color, white);
    border-radius: 50%;
    box-shadow: 0 0 0 2px white;
  }
  #fontBtn::after {
    content: "f";
    font-family: var(--gbc-font, sans-serif);
    font-weight: bold;
    font-size: 21px;
    line-height: 21px;
    color: white;
  }
  #stampBtn {
    padding: 0;
    color: unset;
  }
  .submit-button {
    display: inline-block;
    padding: 0 12px;
    height: 30px;
    margin-left: auto;
    border: none;
    border-radius: 12px;
    font-family: var(--display-font);
    font-weight: bold;
    font-size: 12px;
    background-color: var(--clr0-dark);
    cursor: pointer;
    &:hover,
    &:focus-visible {
      background-color: var(--clr0-light);
    }
  }

  #thanks {
    view-transition-name: thanks;
    padding: 60px 6px 0;
    text-align: center;
    display: none;
  }

  .messages-section {
    min-height: 100vh;
    min-height: 100svh;
    animation: messages-fade-in 1s cubic-bezier(0.8, 0, 0.8, 0.4) backwards;
  }

  #submitted-list {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 30px;
    position: relative;
    z-index: 1;

    > * {
      view-transition-name: form-guestbook-card;
      translate: 0 90px;
      rotate: 1deg;
      &::view-transition {
        animation-duration: 0.2s;
      }
    }
  }

  #messages-list {
    view-transition-name: messages-list;
    padding: 120px min(5vw,40px) 90px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 30px;
    overflow: clip;
    transform: skewY(12deg);

    &::view-transition {
      animation-duration: 0.2s;
    }

    > * {
      margin: calc(max(0px, var(--gbli-margin-y, 0) * 1vmin - 80px))
        calc(max(0px, var(--gbli-margin-x, 0) * 1vmin - 384px / 2))
        calc(max(0px, var(--gbli-margin-y, 0) * -1vmin - 80px));
      transform: skewY(-12deg) rotate(var(--gbli-rotate, 0deg));
      animation: message-scroll 1ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      animation-timeline: view(block);
    }
    > :first-child {
      margin-inline-start: calc(max(0px, 50% - 384px));
    }
    > :last-child {
      margin-inline-end: calc(max(0px, 50% - 384px));
    }
    > :nth-child(3n) {
      --gbli-rotate: 3deg;
    }
    > :nth-child(3n + 1) {
      --gbli-rotate: -3deg;
    }
    > :nth-child(3n + 2) {
      --gbli-rotate: 2deg;
    }
    > :nth-child(4n) {
      --gbli-rotate: -2deg;
    }
    > :nth-child(5n) {
      --gbli-rotate: 1deg;
    }
    > :nth-child(6n) {
      --gbli-rotate: 2deg;
    }
    > :nth-child(7n) {
      --gbli-rotate: -1deg;
    }
    > :nth-child(8n) {
      --gbli-rotate: -2deg;
    }
    > :nth-child(2n) {
      --gbli-margin-y: 3;
    }
    > :nth-child(3n) {
      --gbli-margin-y: -4;
    }
    > :nth-child(5n + 2) {
      --gbli-margin-y: 6;
    }
    > :nth-child(5n + 4) {
      --gbli-margin-y: -7;
    }
    > :nth-child(2n + 1) {
      --gbli-margin-x: 3;
    }
    > :nth-child(3n) {
      --gbli-margin-x: 6;
    }
    > :nth-child(4n + 2) {
      --gbli-margin-x: 7;
    }
    > :nth-child(5n) {
      --gbli-margin-x: 9;
    }
    > :nth-child(6n + 3) {
      --gbli-margin-x: 11;
    }
    > :nth-child(7n) {
      --gbli-margin-x: 12;
    }
    > :nth-child(8n + 6) {
      --gbli-margin-x: 16;
    }
    > :nth-child(9n) {
      --gbli-margin-x: 22;
    }
    > :nth-child(13n) {
      --gbli-margin-x: 29;
    }
  }

  @keyframes messages-fade-in {
    from {
      opacity: 0;
    }
  }

  @keyframes message-scroll {
    from {
      transform: skewY(-12deg) rotate(calc(var(--gbli-rotate, 0deg) * 5))
        translateY(100%);
    }
    to {
      /* same as original value */
      transform: skewY(-12deg) rotate(var(--gbli-rotate, 0deg));
    }
  }

  #load-more {
    margin: 0 0 60px;
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", async () => {
    const {
      BG_COLORS,
      FG_COLORS,
      STAMPS,
      getDefaults,
      getStampContent,
      createGuestbookCard,
    } = await import("/guestbook/guestbook-card.js");

    initForm();
    initMessagesList();

    async function initForm() {
      const form = document.querySelector(".form");
      const { fgRGB, bgRGB, bgStyleIndex, fontIndex } = form.elements;
      const guestbookCard = document.getElementById("guestbook-card");
      const submitBtn = document.getElementById("submitBtn");
      const bgStyleBtn = document.getElementById("bgStyleBtn");
      const bgBtn = document.getElementById("bgBtn");
      const fgBtn = document.getElementById("fgBtn");
      const fontBtn = document.getElementById("fontBtn");
      const stampBtn = document.getElementById("stampBtn");
      const thanks = document.getElementById("thanks");
      const submittedList = document.getElementById("submitted-list");

      form.action = window.GUESTBOOK_API;
      const start = Date.now();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submitBtn.disabled = true;

        const elapsed = Date.now() - start;
        const timeField = document.createElement("input");
        timeField.type = "hidden";
        timeField.name = "timeSpentMs";
        timeField.value = elapsed;
        form.appendChild(timeField);

        const formData = new FormData(form);
        fetch(form.action, {
          method: "post",
          body: formData,
        }).catch(() => {});

        const finishSubmission = () => {
          guestbookCard.toggleAttribute("disabled", true);
          submittedList.prepend(guestbookCard);
          form.remove();
          showThanks(thanks, formData);
        };

        if (document.startViewTransition) {
          document.startViewTransition(finishSubmission);
        } else {
          finishSubmission();
        }
      });

      fgBtn.addEventListener("click", async () => {
        fgRGB.value =
          FG_COLORS[
            (FG_COLORS.indexOf(Number(fgRGB.value)) + 1) % FG_COLORS.length
          ];
        const style = await guestbookCard.updateStyle({
          fgRGB: Number(fgRGB.value),
        });
        form.setAttribute("style", style);
      });

      bgBtn.addEventListener("click", async () => {
        bgRGB.value =
          BG_COLORS[
            (BG_COLORS.indexOf(Number(bgRGB.value)) + 1) % BG_COLORS.length
          ];
        const style = await guestbookCard.updateStyle({
          bgRGB: Number(bgRGB.value),
        });
        form.setAttribute("style", style);
      });

      bgStyleBtn.addEventListener("click", async () => {
        bgStyleIndex.value = (Number(bgStyleIndex.value) + 1) % 4;
        const style = await guestbookCard.updateStyle({
          bgStyleIndex: Number(bgStyleIndex.value),
        });
        form.setAttribute("style", style);
      });

      fontBtn.addEventListener("click", async () => {
        fontIndex.value = (Number(fontIndex.value) + 1) % 3;
        const style = await guestbookCard.updateStyle({
          fontIndex: Number(fontIndex.value),
        });
        form.setAttribute("style", style);
      });

      // Stamp logic
      let holdingStampState = null;
      let stampIndex = Math.floor(Math.random() * STAMPS.length);
      stampBtn.textContent = getStampContent(stampIndex);
      stampBtn.addEventListener("click", async () => {
        if (holdingStampState) {
          stampIndex = (Number(stampIndex) + 1) % STAMPS.length;
          stampBtn.textContent = getStampContent(stampIndex);
        } else {
          const cursorStyle = document.createElement("style");
          document.head.appendChild(cursorStyle);

          holdingStampState = {
            cursorStyle,
          };

          const listenerParameters = [
            "click",
            (event) => {
              if (stampBtn.contains(event.target)) return;

              const bounds = guestbookCard.getBoundingClientRect();
              if (
                event.clientX + size > bounds.left &&
                event.clientX < bounds.right &&
                event.clientY + size > bounds.top &&
                event.clientY < bounds.bottom
              ) {
                const x = Math.round(
                  (100 * (event.clientX - bounds.x)) / bounds.width
                );
                const y = Math.round(
                  (100 * (event.clientY - bounds.y)) / bounds.height
                );
                guestbookCard.addStamp(stampIndex, x, y);
              }

              setTimeout(() => cursorStyle.remove());
              holdingStampState = null;

              event.preventDefault();
              document.activeElement?.blur();
              window.removeEventListener(...listenerParameters);
            },
            { capture: true },
          ];
          window.addEventListener(...listenerParameters);
        }

        const content = getStampContent(stampIndex);
        const size = 60;
        holdingStampState.cursorStyle.textContent = `
            body, #guestbook-card * {
              cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='${
                (size * 5) / 3
              }px' height='${
          size * 2
        }px' viewport='0 0 100 100' style='fill:black;font-size:${size}px;'><text y='50%'>${content}</text></svg>") 0 0,grabbing
            }`;
      });
    }

    // why use LLMs when you can use if-else chains
    function showThanks(thanksElement, formData) {
      thanksElement.style.display = "block";

      const text = formData.get("text");
      const lowText = text.toLowerCase();
      if (lowText.match(/\blove\b/)) {
        thanksElement.textContent = "🩵 Very much appreciated! 🩵";
      } else if (lowText.match(/\binspir(e|ed|ing|ation|ational)\b/)) {
        thanksElement.textContent = "Your words inspire me too!";
      } else if (lowText.match(/\bthanks?( you)?\b/)){
        thanksElement.textContent = "I appreciate you too!";
      } else if (text.includes("<script>") && text.includes("<"+ "/script>")) {
        // we do a little trolling
        const matchAlert = text.match(/alert\((\d+)|(?:['"](.*?)['"])|(document.cookie)|(document.domain)/);
        if (matchAlert) {
          const [, num, string, cookie, domain] = matchAlert;
          if (num) {
            alert(num);
          } else if (string) {
            alert(string);
          } else if(cookie) {
            alert("Here’s your cookie 🍪");
          } else if(domain) {
            alert("localhost");
          }
        }
        thanksElement.textContent = "Nice try, thanks anyway. ;)";
      }
    }

    async function initMessagesList() {
      const messagesSection = document.querySelector(".messages-section");
      const messagesList = document.getElementById("messages-list");
      const loadMoreButton = document.getElementById("load-more");

      let nextPage = 0;
      let inferredPageSize = 0;

      loadNextPage(nextPage);
      nextPage++;

      loadMoreButton.addEventListener("click", async () =>{
        loadMoreButton.disabled = true;
        try {
          const result = await loadNextPage(nextPage);
          nextPage++;
          if (result?.end) {
            loadMoreButton.remove();
          } else {
            loadMoreButton.disabled = false;
          }
        } catch (e) {
          loadMoreButton.disabled = false;
        }
      });

      async function loadNextPage(page) {
        const response = await fetch(GUESTBOOK_API + "?page=" + page);
        if (!response.ok) throw new Error();
        const data = await response.json();

        if (!Array.isArray(data)) {
          return { end: true };
        }

        if (data.length > inferredPageSize) {
          inferredPageSize = data.length;
        }

        const showMessages = async () => {
          if (page === 0) messagesList.replaceChildren();
          for (const message of data) {
            messagesList.appendChild(await renderMessage(message));
          }
        };

        if (document.startViewTransition) {
          document.startViewTransition(showMessages);
        } else {
          showMessages();
        }

        if (data.length < inferredPageSize) {
          return { end: true };
        }
      }

      async function renderMessage(message) {
        return createGuestbookCard({
          text: message.text,
          name: message.name,
          stamps: message.stamps,
          fontIndex: message.fontIndex,
