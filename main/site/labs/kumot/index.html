<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: sans-serif;
  }

  #pattern {
    position: absolute;
    inset: 0;
  }

  #controls {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: #1a1a1e;
    color: #ccc;
    border-radius: 8px;
    box-shadow: 0 8px 32px #0008;
  }

  #controls label {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
</style>

<div id="pattern"></div>
<div id="controls">
  <label>
    Dark
    <input type="range" id="dark" min="0" max="200" value="64" step="0.1" />
  </label>
  <label>
    Light
    <input type="range" id="light" min="0" max="200" value="96" step="0.1" />
  </label>
  <label>
    Line
    <input type="range" id="line" min="0" max="30" value="5" step="0.1" />
  </label>
  <label>
    Hue
    <input type="range" id="hue" min="0" max="360" value="270" step="1" />
  </label>
</div>

<script>
  const pattern = document.getElementById("pattern");
  const hueInput = document.getElementById("hue");
  const darkInput = document.getElementById("dark");
  const lightInput = document.getElementById("light");
  const lineInput = document.getElementById("line");

  const config = readInputs();

  animateEntrance(0);
  function animateEntrance(t) {
    const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const interpolated = {
      hue: config.hue + -120 * (1 - ease),
      darkSize: config.darkSize * ease,
      lightSize: config.lightSize * ease + 900 * (1 - ease),
      lineSize: config.lineSize * Math.max(0, ease * 3 - 2),
    };
    render(interpolated);
    if (t < 1) {
      requestAnimationFrame(() => animateEntrance(Math.min(1, t + 0.005)));
    }
  }

  function readInputs() {
    return {
      hue: Number.parseFloat(hueInput.value),
      darkSize: Number.parseFloat(darkInput.value),
      lightSize: Number.parseFloat(lightInput.value),
      lineSize: Number.parseFloat(lineInput.value),
    };
  }

  for (const input of document.querySelectorAll("#controls input")) {
    input.oninput = () => {
      const inputs = readInputs();
      for (const key of Object.keys(inputs)) {
        if (key.startsWith(input.id)) config[key] = inputs[key];
      }

      inputs.lineSize = Math.min(
        config.lineSize,
        Math.max(inputs.darkSize, inputs.lightSize),
      );
      lineInput.value = inputs.lineSize;
      render(inputs);
    };
  }

  pattern.addEventListener("pointermove", (event) => {
    // console.log(event.clientX);
  });

  function render(config) {
    const color = `oklch(90% 20% ${config.hue}deg)`;

    const stops = [];
    let isDarkSegment = false;
    let offset = 0;
    for (const Size of [
      config.lineSize,
      config.darkSize,
      config.lightSize,
      config.lineSize,
      config.lineSize * 2,
      config.lineSize,
      config.lightSize,
      config.darkSize,
    ]) {
      const stopColor = isDarkSegment ? color : "#ffffff";
      stops.push(`${stopColor} ${offset}px`);
      offset += Size;
      stops.push(`${stopColor} ${offset}px`);
      isDarkSegment = !isDarkSegment;
    }
    pattern.style.backgroundImage = `linear-gradient(to right, ${stops.join(", ")})`;
    pattern.style.backgroundSize = `${offset}px 100%`;
    pattern.style.backgroundPosition = `${window.innerWidth / 2}px`;
  }
</script>
