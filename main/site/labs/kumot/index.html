<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: sans-serif;
  }

  #pattern {
    position: absolute;
    inset: 0;
    background-position: center;
  }

  #controls {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: #1a1a1e;
    color: #ccc;
    border-radius: 8px;
    box-shadow: 0 8px 32px #0008;
  }

  #controls label {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
</style>

<div id="pattern"></div>
<div id="controls">
  <label>
    Dark
    <input type="range" id="dark" min="4" max="200" value="64" step="0.1" />
  </label>
  <label>
    Light
    <input type="range" id="light" min="4" max="200" value="96" step="0.1" />
  </label>
  <label>
    Line
    <input type="range" id="line" min="0" max="15" value="3" step="0.1" />
  </label>
  <label>
    Hue
    <input type="range" id="hue" min="0" max="360" value="0" step="1" />
  </label>
</div>

<script>
  const pattern = document.getElementById("pattern");

  function render() {
    const hue = Number.parseFloat(document.getElementById("hue").value);
    const color = `oklch(90% 20% ${hue}deg)`;
    const darkBandWidth = Number.parseFloat(
      document.getElementById("dark").value,
    );
    const lighBandWidth = Number.parseFloat(
      document.getElementById("light").value,
    );
    const lineValue = Number.parseFloat(document.getElementById("line").value);
    const lineWidth = (darkBandWidth + lighBandWidth) * (lineValue / 100);

    const stops = [];
    let isDarkSegment = true;
    let offset = 0;
    for (const width of [
      darkBandWidth,
      lineWidth,
      darkBandWidth,
      lighBandWidth,
      lineWidth,
      lineWidth * 2,
      lineWidth,
      lighBandWidth,
    ]) {
      const stopColor = isDarkSegment ? color : "#ffffff";
      stops.push(`${stopColor} ${offset}px`);
      offset += width;
      stops.push(`${stopColor} ${offset}px`);
      isDarkSegment = !isDarkSegment;
    }
    pattern.style.backgroundImage = `linear-gradient(to right, ${stops.join(", ")})`;
    pattern.style.backgroundSize = `${offset}px 100%`;
  }

  for (const input of document.querySelectorAll("#controls input")) {
    input.oninput = render;
  }
  render();
</script>
