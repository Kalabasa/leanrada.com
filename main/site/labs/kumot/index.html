<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: sans-serif;
  }

  #pattern {
    position: absolute;
    inset: 0;
  }

  #controls {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: #1a1a1e;
    color: #ccc;
    border-radius: 8px;
    box-shadow: 0 8px 32px #0008;
    transition: opacity 0.3s;

    :root:not(.ready) & {
      opacity: 0;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
  }
</style>

<div id="pattern"></div>

<div id="controls">
  <label>
    Dark
    <input type="range" id="dark" min="0" max="200" value="64" step="0.1" />
  </label>
  <label>
    Light
    <input type="range" id="light" min="0" max="200" value="96" step="0.1" />
  </label>
  <label>
    Line
    <input type="range" id="line" min="0" max="30" value="5" step="0.1" />
  </label>
  <label>
    Hue
    <input type="range" id="hue" min="0" max="360" value="270" step="1" />
  </label>
</div>

<script>
  const pattern = document.getElementById("pattern");
  const hueInput = document.getElementById("hue");
  const darkInput = document.getElementById("dark");
  const lightInput = document.getElementById("light");
  const lineInput = document.getElementById("line");

  const config = {
    ...readInputs(),
    offset: window.innerWidth / 2,
  };

  animateEntrance(0);
  function animateEntrance(t) {
    // prettier-ignore
    const ease = t === 0 ? 0 : t === 1   ? 1 : t < 0.5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2;
    const interpolated = {
      ...config,
      hue: config.hue + -120 * (1 - ease),
      darkSize: config.darkSize * ease,
      lightSize: config.lightSize * ease + 900 * (1 - ease),
      lineSize: config.lineSize * Math.max(0, ease * 20 - 19),
    };
    render(interpolated);
    if (t < 1) {
      requestAnimationFrame(() => animateEntrance(Math.min(1, t + 0.01)));
    } else {
      document.documentElement.classList.add("ready");
    }
  }

  function readInputs() {
    return {
      hue: Number.parseFloat(hueInput.value),
      darkSize: Number.parseFloat(darkInput.value),
      lightSize: Number.parseFloat(lightInput.value),
      lineSize: Number.parseFloat(lineInput.value),
    };
  }

  for (const input of document.querySelectorAll("#controls input")) {
    input.oninput = () => {
      const newConfig = { ...config, ...readInputs() };
      for (const key of Object.keys(newConfig)) {
        if (key.startsWith(input.id)) config[key] = newConfig[key];
      }

      const bandMinSize = 8;

      lineInput.value = newConfig.lineSize = Math.min(
        config.lineSize,
        Math.max(bandMinSize, newConfig.darkSize, newConfig.lightSize),
      );

      if (input === darkInput) {
        lightInput.value = newConfig.lightSize = Math.max(
          config.lightSize,
          bandMinSize - newConfig.darkSize,
        );
      } else if (input === lightInput) {
        darkInput.value = newConfig.darkSize = Math.max(
          config.darkSize,
          bandMinSize - newConfig.lightSize,
        );
      }

      render(newConfig);
    };
  }

  pattern.addEventListener("pointermove", (event) => {
    console.log(event.clientX);
  });

  function render(config) {
    const color = `oklch(90% 20% ${config.hue}deg)`;

    const stops = [];
    let isDarkSegment = false;
    let stopOffset = 0;
    for (const size of [
      config.lineSize,
      config.darkSize,
      config.lightSize,
      config.lineSize,
      config.lineSize * 2,
      config.lineSize,
      config.lightSize,
      config.darkSize,
    ]) {
      const stopColor = isDarkSegment ? color : "#fff";
      stops.push(`${stopColor} ${stopOffset}px`);
      stopOffset += size;
      stops.push(`${stopColor} ${stopOffset}px`);
      isDarkSegment = !isDarkSegment;
    }
    pattern.style.backgroundImage = `linear-gradient(to right, ${stops.join(", ")})`;
    pattern.style.backgroundSize = `${stopOffset}px 100%`;
    pattern.style.backgroundPosition = `${config.offset}px`;
  }
</script>
