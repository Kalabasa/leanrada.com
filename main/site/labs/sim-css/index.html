<style>
  .box {
    background: linear-gradient(to bottom, blue, green);
    width: 50px;
    height: 50px;
    animation:
      x 3s infinite linear(0, 1, 0.25, 0.5),
      y 3s infinite linear(0.5, 1, 0.8, 0),
      r 3s infinite linear(0, 1 33%, 0 33%, 1, 0);
    animation-composition: accumulate;
  }
  @keyframes x {
    0% {
      translate: 0 0;
    }
    100% {
      translate: 200px 0;
    }
  }
  @keyframes y {
    0% {
      translate: 0 0;
    }
    100% {
      translate: 0 200px;
    }
  }
  @keyframes r {
    0% {
      rotate: 0;
    }
    100% {
      rotate: 1turn;
    }
  }
</style>
<div class="box"></div>
