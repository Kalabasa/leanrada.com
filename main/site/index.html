<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/common.css" />
<script defer src="/common.js"></script>

<title>leanrada.com</title>

<site-header prehide></site-header>

<section class="header">
  <div class="header-content">
    <div class="header-circle">
      <nebula-animation
        class="nebula"
        palette="#e79907 #bf1852 #4d4aff #0ad591"
        mouse
      ></nebula-animation>
      <div class="header-circle-text header-circle-text-big">
        <script>
          function renderCircleText(radiusVh, angleStepDeg, text) {
            let htmlString = "";
            let angle = angleStepDeg * -((text.length - 1) / 2);
            for (const char of text) {
              htmlString += `<span class="header-circle-text-char" style="transform: translateX(calc(${radiusVh}vh - 0.5ch)) rotate(${angle}deg); transform-origin: 0.5ch ${radiusVh}vh">${char}</span>`;
              angle += angleStepDeg;
            }
            document.currentScript.parentElement.innerHTML = htmlString;
          }
          renderCircleText(18, 7.5, "Welcome to my personal website!");
        </script>
      </div>
      <div class="header-circle-text header-circle-text-small">
        <script>
          renderCircleText(13, 9, "Welcome to my site!");
        </script>
      </div>
      <img class="home-circle-icon" src="/icons/yay_sheet.png" alt="" />
    </div>

    <span class="intro-text">
      <div class="intro-spacer"></div>
      <span class="intro-line">
        Hello!
        <script>
          document.currentScript.parentElement.textContent = [
            "Hello!",
            "Hey~~~",
            "What’s up ↑",
            "Hi there →",
            "Hey there →",
          ][Date.now() % 5];
        </script>
      </span>
      <br />
      <span class="intro-line">
        I’m Lean
        <a class="ipa" href="https://ipa-reader.xyz/?text=lian"
          >/<span class="ipa-text">liˈan</span>/<span class="ipa-icon"
            >🔊</span
          ></a
        >,
      </span>
      <br />
      <span class="intro-line"> software engineer </span>
      <br />
      <span class="intro-line">
        who likes making <a href="/notes/">stuff</a>,
      </span>
      <br />
      <span class="intro-line">
        <a href="/wares/">code</a>, <a href="/art/">art</a>, and
        <a href="/music/">music</a>.
      </span>
      <br />
      <br />
      <span class="intro-line"> Nice to meet you. </span>
      <br />
      <span class="intro-line">
        Please, <great-time-trigger>have a great time.</great-time-trigger>
      </span>
    </span>
  </div>
</section>

<site-footer></site-footer>

<style>
  section.header {
    display: flex;
    justify-content: center;
    align-items: center;
    height: clamp(95vh, 600px, 100vh);
  }
  @media (prefers-reduced-motion) {
    section.header * {
      animation: none !important;
    }
  }

  .header-content {
    white-space: nowrap;
    height: 40vh;
    min-width: 80vh;
    overflow: hidden;
  }

  .header-circle {
    position: relative;
    display: block;
    float: left;
    width: 40vh;
    height: 40vh;
    box-sizing: content-box;
    margin: 0vh 2vh;
    border-radius: 50%;
    background: #bf1852;
    shape-outside: circle(calc(50% + 1vh));
    text-align: initial;
    overflow: hidden;
    animation: header-circle-reveal 0.5s cubic-bezier(1, 0, 0.9, 1),
      fade-background-in 0.2s;
  }
  @keyframes header-circle-reveal {
    from {
      clip-path: circle(2.5vh);
    }
    to {
      clip-path: circle(50%);
    }
  }
  @keyframes fade-background-in {
    from {
      background: transparent;
    }
  }

  .header-circle-text {
    position: relative;
    margin: 2vh;
    width: 100%;
    height: 100%;
    font-family: var(--display-font);
    font-size: 3vh;
    font-style: italic;
    color: #fff;
    animation: home-circle-text-animation 7s
      cubic-bezier(0.785, 0.135, 0.15, 0.86) infinite;
  }

  @keyframes home-circle-text-animation {
    to {
      transform: rotate(-1turn);
    }
  }

  .nebula {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
  }

  .header-circle-text-big {
    width: 36vh;
    height: 36vh;
  }
  .header-circle-text-small {
    display: none;
  }
  .header-circle-text-char {
    display: inline-block;
    width: 0;
  }

  .home-circle-icon {
    position: absolute;
    left: calc(50% - 2.5vh);
    top: calc(50% - 2.5vh);
    width: 5vh;
    height: 5vh;
    object-fit: cover;
    object-position: 0 0;
    image-rendering: pixelated;
    filter: invert(1);
  }

  .header-circle:hover .header-circle-text-char {
    color: transparent;
    clip-path: inset(0.8ex -1ch 0);
    animation: header-circle-text-shadow-animation 0.6s
      cubic-bezier(0, 0, 0.2, 1) forwards;
  }
  @keyframes header-circle-text-shadow-animation {
    0% {
      text-shadow: 0 8vh 0 #fff, 0 4vh 0 #fff, 0 0 0 #fff;
    }
    100% {
      text-shadow: 0 0 0 #fff, 0 -4vh 0 #fff, 0 -8vh 0 #fff;
    }
  }
  .header-circle:hover .home-circle-icon {
    object-position: 20% 0;
  }

  .intro-text {
    line-height: 1.8;
    font-size: 2.2vh;
    font-style: italic;
    animation: intro-text 0.8s 0.4s cubic-bezier(0, 0.7, 0.4, 1) backwards;
  }
  @keyframes intro-text {
    from {
      line-height: 8;
    }
  }

  .intro-line {
    display: inline-block;
    animation: intro-text-drift 0.9s cubic-bezier(0, 0.8, 0.2, 1) both;
  }
  .intro-line a,
  .intro-line a:visited {
    color: inherit;
  }
  @keyframes intro-text-drift {
    from {
      transform: translate(-1em, 4em);
      text-shadow: 0 3em 0 var(--clr0), 0 6em 0 var(--clr1);
    }
    to {
      transform: translate(0, 0);
      text-shadow: 0 0 0 var(--clr0), 0 0 0 var(--clr1);
    }
  }

  .intro-spacer {
    display: block;
    height: 0px;
    animation: intro-spacer 0.4s 0.4s cubic-bezier(0, 0.8, 0.1, 1) backwards;
  }
  @keyframes intro-spacer {
    from {
      height: 100%;
    }
  }

  .ipa {
    font-size: 85%;
    font-style: normal;
    text-decoration: none;
    color: inherit;
  }
  .ipa-text {
    text-decoration: underline;
  }
  .ipa-icon {
    display: inline-block;
    transform: scale(0.6);
    filter: brightness(8);
  }

  @media (max-aspect-ratio: 4/5) {
    .header {
      height: auto;
      min-height: 95vh;
      margin: 30px 0 60px;
    }
    .header-content {
      height: auto;
      min-width: unset;
      text-align: center;
    }
    .header-circle {
      display: inline-block;
      float: none;
      width: 30vh;
      height: 30vh;
    }
    .header-circle-text-big {
      display: none;
    }
    .header-circle-text-small {
      display: block;
      width: 26vh;
      height: 26vh;
    }
    .intro-text {
      display: block;
      margin-top: 4vh;
      font-size: 16px;
      animation: intro-text-mobile 1s cubic-bezier(0.8, 0.2, 0.2, 0.8);
    }
    .intro-spacer {
      animation: none;
    }
  }
  @keyframes intro-text-mobile {
    from {
      clip-path: inset(0 0 100% 0);
    }
    to {
      clip-path: inset(0 0 0 0);
    }
  }

  .section {
    max-width: 1200px;
    margin: 0 auto max(10vmin, 150px);
    padding: 0 60px;
    font-size: 15px;
    text-align: center;
  }
  .section:last-child {
    margin-bottom: 150px;
  }
  .section > p {
    margin: 30px 0;
    line-height: 2;
  }
  .section-title {
    margin: 0 0 36px;
    font-family: var(--display-font);
    font-size: 21px;
    font-style: italic;
    font-weight: bold;
  }
  @media (max-width: 800px) {
    .section {
      padding: 0 18px;
    }
  }
  .start-from-top .section {
    animation: section-appear 0.2s 1s backwards;
  }
  @keyframes section-appear {
    from {
      opacity: 0;
    }
  }

  .about-section {
    position: relative;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 60px;
    z-index: 0;
  }
  .about-subsection {
    flex: 1 1 50%;
    max-width: 520px;
    text-align: start;
  }
  .magnetic-field {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 100vw;
    height: 90%;
    transform: translate(-50%, -50%);
    z-index: -1;
  }

  .cursor-section {
    display: none;
  }
  @media (any-hover: hover) {
    .cursor-section {
      display: revert;
    }
  }

  .projects-section {
    max-width: unset;
    overflow: hidden;
  }
  .projects-section .section-title {
    margin-bottom: 60px;
  }
  .more-projects {
    display: inline-block;
    margin-top: 30px;
    font-weight: bold;
  }
  .more-projects::after {
    content: "→";
    display: inline-block;
  }

  .more-notes {
    display: inline-block;
    margin-top: 30px;
    font-weight: bold;
  }
  .more-notes::after {
    content: "→";
    display: inline-block;
  }

  .misc-section {
    position: relative;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 36px;
  }
  .misc-subsection {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1 1 50%;
    min-height: 195px;
    max-width: 390px;
    text-align: center;
  }
  @media (max-width: 462px) {
    .misc-section {
      gap: 18px;
    }
    .misc-subsection {
      min-height: 130px;
    }
  }
  .more-misc {
    display: inline-block;
    font-weight: bold;
    text-align: center;
  }
  .more-misc::after {
    content: "→";
    display: inline-block;
  }
  .hit-counter-subsection {
    font-size: 36px;
  }
</style>

<script>
  window.addEventListener("load", () => {
    const yayIcon = document.querySelector(".home-circle-icon");
    const sayLean = new Audio("/lean.mp3");
    document.body.classList.toggle("start-from-top", window.scrollY < 100);

    let sayTime = 0;
    const ipa = document.querySelector(".ipa");
    ipa.addEventListener("click", (event) => {
      if (sayLean.readyState >= /*HAVE_ENOUGH_DATA*/ 4) {
        event.preventDefault();
        sayLean.play();
      }
    });

    function animateYay() {
      const t = (Date.now() - sayTime) / (sayLean.duration * 1000) * 2.0;

      if (t >= 1) {
        yayIcon.style.objectPosition = null;
      } else {
        const frame = Math.floor(t * 2) + 1;
        if (frame >= 0 && frame <= 2) {
          yayIcon.style.objectPosition = 40 + (frame % 3) * 20 + "% 0";
        } else if (frame > 2) {
          yayIcon.style.objectPosition = "40% 0";
        } else {
          yayIcon.style.objectPosition = null;
        }
        requestAnimationFrame(animateYay);
      }
    }

    sayLean.addEventListener("play", () => {
      // hardcoded offset
      sayTime = Date.now() + 300;
      animateYay();
    });
  });
</script>
