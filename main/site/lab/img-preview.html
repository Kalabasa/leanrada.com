<div></div>

<style>
  body {
    display: grid;
    place-content: center;
    background-color: darkslategray;
  }

  div {
    width: 200px;
    height: 200px;
    border: 2px solid black;

    --src-color1: rgb(255, 0, 0);
    --src-color2: rgb(0, 255, 0);
    --src-color3: rgb(0, 0, 255);
    --src-color4: rgb(0, 0, 0);

    --color1: var(--src-color1);
    --color2: var(--src-color2);
    --color3: var(--src-color3);
    --color4: var(--src-color4);

    &:hover {
      --color1: var(--src-color2);
      --color2: var(--src-color3);
      --color3: var(--src-color4);
      --color4: var(--src-color1);
    }

    --color-space: srgb;

    --average: color-mix(
      in var(--color-space),
      color-mix(in var(--color-space), var(--color1), var(--color2)),
      color-mix(in var(--color-space), var(--color3), var(--color4))
    );

    background-image: radial-gradient(
        70.71% 70.71% at center,
        var(--average),
        transparent
      ),
      conic-gradient(
        from -45deg in var(--color-space),
        var(--color1),
        var(--color2),
        var(--color3),
        var(--color4),
        var(--color1)
      );
  }
</style>
