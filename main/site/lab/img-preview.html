<style>
  body {
    display: grid;
    place-content: center;
    background-color: darkslategray;
  }

  /*
  --placeholder: 20-bit number
  :98765432109876543210:
  :aaBBccDDeeFFllxxxYYY:

  - 20 bits
    - 6 x 2-bit grayscale area values
    - 2-bit oklab L channel
    - 3-bit oklab A channel
    - 3-bit oklab B channel
  */
  div {
    width: 800px;
    height: 400px;
    border: 2px solid black;

    --ca: 1;
    --cb: 1;
    --cc: 1;
    --cd: 1;
    --ce: 1;
    --cf: 1;
    --labl: 0;
    --laba: 0;
    --labb: 0;

    --ca-color: hsl(0 0% calc(var(--ca) / 3 * 100%));
    --cb-color: hsl(0 0% calc(var(--cb) / 3 * 100%));
    --cc-color: hsl(0 0% calc(var(--cc) / 3 * 100%));
    --cd-color: hsl(0 0% calc(var(--cd) / 3 * 100%));
    --ce-color: hsl(0 0% calc(var(--ce) / 3 * 100%));
    --cf-color: hsl(0 0% calc(var(--cf) / 3 * 100%));
    --base-color: oklab(
      calc(var(--labl) / 3) calc(var(--laba) / 7 * 0.8 - 0.4)
        calc(var(--labb) / 7 * 0.8 - 0.4)
    );

    --ellipse-w: 33.33%;
    --ellipse-h: 50%;
    background-blend-mode: hard-light, hard-light, hard-light, hard-light,
      hard-light, hard-light, overlay, overlay, overlay, overlay, overlay,
      overlay;
    background-image: radial-gradient(
        var(--ellipse-w) var(--ellipse-h) at 16.67% 25%,
        var(--ca-color),
        transparent
      ),
      radial-gradient(
        var(--ellipse-w) var(--ellipse-h) at 50% 25%,
        var(--cb-color),
        transparent
      ),
      radial-gradient(
        var(--ellipse-w) var(--ellipse-h) at 83.33% 25%,
        var(--cc-color),
        transparent
      ),
      radial-gradient(
        var(--ellipse-w) var(--ellipse-h) at 16.67% 75%,
        var(--cd-color),
        transparent
      ),
      radial-gradient(
        var(--ellipse-w) var(--ellipse-h) at 50% 75%,
        var(--ce-color),
        transparent
      ),
      radial-gradient(
        var(--ellipse-w) var(--ellipse-h) at 83.33% 75%,
        var(--cf-color),
        transparent
      ),
      radial-gradient(
        var(--ellipse-w) var(--ellipse-h) at 16.67% 25%,
        var(--ca-color),
        transparent
      ),
      radial-gradient(
        var(--ellipse-w) var(--ellipse-h) at 50% 25%,
        var(--cb-color),
        transparent
      ),
      radial-gradient(
        var(--ellipse-w) var(--ellipse-h) at 83.33% 25%,
        var(--cc-color),
        transparent
      ),
      radial-gradient(
        var(--ellipse-w) var(--ellipse-h) at 16.67% 75%,
        var(--cd-color),
        transparent
      ),
      radial-gradient(
        var(--ellipse-w) var(--ellipse-h) at 50% 75%,
        var(--ce-color),
        transparent
      ),
      radial-gradient(
        var(--ellipse-w) var(--ellipse-h) at 83.33% 75%,
        var(--cf-color),
        transparent
      ),
      linear-gradient(0deg, var(--base-color), var(--base-color));

    filter: blur(4vmax) drop-shadow(0 0 0 var(--base-color));
    clip-path: rect(0% 100% 100% 0% round 18px);
  }
</style>
