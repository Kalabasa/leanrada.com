<link rel="stylesheet" href="/common.css">

<style>
  main {
    img {
      width: min(calc(50lvw - 1em), 200px);
      height: auto;
      vertical-align: middle;
      cursor: pointer;

      &:hover.lqip-img-blurred {
        filter: blur(calc(min(calc(50lvw - 1em), 200px) / 6));
        clip-path: inset(0 0 0 0);
      }
    }
  }
</style>
<style id="lqip-debug">
  [style*="--lqip:"]:not(:hover) {
    object-position: calc(infinity * 1px) !important;
  }
</style>
